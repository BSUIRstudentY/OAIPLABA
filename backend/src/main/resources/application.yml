server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: vidvault-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vidvault}
    username: ${DATABASE_USER:vidvault}
    password: ${DATABASE_PASSWORD:vidvault}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

vidvault:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-long-dev-only-secret-key-1234567890}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:vidvault-videos}
  admin:
    email: ${ADMIN_EMAIL:admin@vidvault.io}
    password: ${ADMIN_PASSWORD:admin12345}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.vidvault: INFO
